<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material - / Werkzeugverwaltung</title>
  
  <!-- Bibliotheken -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://unpkg.com/pouchdb@7.3.1/dist/pouchdb.min.js"></script>

  <style>
    body { font-family: sans-serif; padding: 15px; background: #f4f4f9; margin: 0; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2, h3 { text-align: center; margin-top: 0; color: #333; }
    
    #reader { 
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 450px;
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
    }
    
    #status { font-weight: bold; margin: 10px 0; text-align: center; min-height: 20px; color: #007bff; }
    
    .btn { display: block; width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; box-sizing: border-box; }
    .btn-green { background: #28a745; color: white; }
    .btn-orange { background: #fd7e14; color: white; }
    .btn-blue { background: #007bff; color: white; }
    .btn-gray { background: #6c757d; color: white; }
    .btn-red { background: #dc3545; color: white; }
    .btn-purple { background: #6f42c1; color: white; }
    
    .btn:disabled { background: #cccccc; cursor: not-allowed; }
    
    .box { border: 1px solid #ddd; padding: 15px; margin-top: 15px; border-radius: 5px; background: #fafafa; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #eee; }
    
    .hidden { display: none !important; }
    
    /* Foto-Vorschau Styling */
    .photo-preview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 10px; border-radius: 4px; border: 1px solid #ccc; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>Material - / Werkzeugverwaltung</h2>
  <div id="status">Bereit</div>

  <!-- HAUPTANSICHT -->
  <div id="mainSection">
    <button class="btn btn-blue" onclick="startMainScanner()">
      📷 Barcode / QR scannen
    </button>
    <button class="btn btn-gray" onclick="toggleAdmin()">
      ⚙️ Adminbereich (Lager/Werkzeuge)
    </button>
  </div>

  <!-- ERGEBNIS / BUCHUNG -->
  <div id="resultSection" class="box hidden">
    <h3>Erkanntes Objekt</h3>
    <p><strong>Typ:</strong> <span id="itemType">-</span></p>
    <p><strong>Name:</strong> <span id="itemName">-</span></p>
    <p><strong>ID/Code:</strong> <span id="itemId">-</span></p>
    <p id="itemStockRow" class="hidden"><strong>Aktueller Bestand:</strong> <span id="itemStock">-</span></p>
    <p id="itemStatusRow" class="hidden"><strong>Status:</strong> <span id="itemStatus">-</span></p>

    <!-- Foto Anzeige bei Suchergebnis -->
    <img id="resultPhoto" class="photo-preview" src="" alt="Objektfoto">

    <hr>

    <!-- Dynamische Buchungs-Felder -->
    <div id="bookingFields">
      <label for="technicianName">Techniker / Name:*</label>
      <input type="text" id="technicianName" placeholder="Dein Name">

      <!-- Verbrauchsmaterial Felder -->
      <div id="consumableBooking" class="hidden">
        <label for="takeQuantity">Menge entnehmen:*</label>
        <input type="number" id="takeQuantity" min="1" value="1">
      </div>

      <!-- Werkzeug Felder -->
      <div id="toolBooking" class="hidden">
        <label for="toolAction">Aktion:*</label>
        <select id="toolAction">
          <option value="Ausleihen">Ausleihen</option>
          <option value="Rückgabe">Rückgabe</option>
        </select>
      </div>

      <label for="bookingComment">Kommentar / Verwendungszweck (optional):</label>
      <input type="text" id="bookingComment" placeholder="z.B. Baustelle X">

      <button class="btn btn-green" id="btnSaveBooking" onclick="saveBooking()" style="margin-top: 15px;">
        💾 Buchung Speichern
      </button>
    </div>

    <button class="btn btn-gray" onclick="zurueckZurHauptansicht()">Zurück</button>
  </div>

  <!-- ADMINBEREICH -->
  <div id="adminSection" class="box hidden">
    <h3>⚙️ Admin: Anlegen & Verwalten</h3>
    
    <label for="itemClass">Kategorie wählen:</label>
    <select id="itemClass" onchange="toggleAdminFormFields()">
      <option value="verbrauch">Verbrauchsmaterial</option>
      <option value="werkzeug">Werkzeug</option>
    </select>

    <label for="adminCode">Barcode / QR-Code:*</label>
    <div style="display: flex; gap: 5px;">
      <input type="text" id="adminCode" placeholder="Code einscannen oder tippen">
      <button class="btn btn-orange" style="width: auto; margin: 5px 0 0 0;" onclick="startFieldScanner('adminCode')">📷</button>
    </div>

    <label for="adminName">Bezeichnung / Name:*</label>
    <input type="text" id="adminName" placeholder="z.B. Dübel 8mm oder Akkuschrauber">

    <!-- Spezifisch Verbrauch -->
    <div id="adminConsumableFields">
      <label for="adminStock">Start-Bestand:*</label>
      <input type="number" id="adminStock" min="0" value="10">
    </div>

    <!-- Foto Upload / Aufnahme -->
    <label for="adminPhotoInput">Foto (optional):</label>
    <input type="file" id="adminPhotoInput" accept="image/*" capture="environment" onchange="previewAdminPhoto(event)">
    <img id="adminPhotoPreview" class="photo-preview" src="" alt="Vorschau">

    <button class="btn btn-green" onclick="saveItemToDb()" style="margin-top: 15px;">Artikelsatz Speichern</button>
    <button class="btn btn-gray" onclick="toggleAdmin()">Schließen</button>

    <hr style="margin: 20px 0;">
    
    <h3>Bestandsliste</h3>
    <button class="btn btn-gray" onclick="loadInventoryTable()">🔄 Liste aktualisieren</button>
    <div style="overflow-x:auto;">
      <table id="inventoryTable">
        <thead>
          <tr>
            <th>Typ</th>
            <th>Name</th>
            <th>Code</th>
            <th>Info/Bestand</th>
            <th>Aktion</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <hr style="margin: 20px 0;">

    <h3>📤 Daten Export / Import</h3>
    <button class="btn btn-purple" onclick="exportDataJSON()">📥 Datenbank als JSON sichern</button>
    
    <label for="importFile" style="margin-top: 15px;">JSON-Sicherung wiederherstellen:</label>
    <input type="file" id="importFile" accept=".json" onchange="importDataJSON(event)">
  </div>

  <!-- KAMERA DISPLAY -->
  <div id="reader"></div>

</div>

<script>
  // --- DATENBANK SETUP ---
  const db = new PouchDB('werkzeug_lager_db');

  // Globale Variablen
  let html5QrcodeScanner = null;
  let activeTargetFieldId = null; 
  let currentScannedItem = null; 
  let currentAdminPhotoBase64 = ""; 

  // --- KAMERA / SCANNER LOGIK ---

  async function startMainScanner() {
    activeTargetFieldId = null;
    await startCamera();
  }

  async function startFieldScanner(targetInputId) {
    activeTargetFieldId = targetInputId;
    await startCamera();
  }

  async function startCamera() {
    document.getElementById("status").innerText = "Starte Kamera...";
    document.getElementById("reader").style.display = "block";

    if (!html5QrcodeScanner) {
      html5QrcodeScanner = new Html5Qrcode("reader");
    }

    try {
      await html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess
      );
      document.getElementById("status").innerText = "Scanner aktiv...";
    } catch (err) {
      document.getElementById("reader").style.display = "none";
      document.getElementById("status").innerText = "Kamera-Fehler: " + err;
    }
  }

  function stopCameraManual() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        document.getElementById("reader").style.display = "none";
        document.getElementById("status").innerText = "Scan abgebrochen";
      }).catch(err => {
        document.getElementById("reader").style.display = "none";
      });
    }
  }

  async function onScanSuccess(decodedText, decodedResult) {
    // Kamera nach Erfolg stoppen
    if (html5QrcodeScanner) {
      await html5QrcodeScanner.stop();
      document.getElementById("reader").style.display = "none";
    }

    document.getElementById("status").innerText = "Gescannter Code: " + decodedText;

    // Unterscheidung: Wurde der Scanner aus einem Textfeld gestartet?
    if (activeTargetFieldId) {
      document.getElementById(activeTargetFieldId).value = decodedText;
      activeTargetFieldId = null;
    } else {
      // Hauptscanner: In DB suchen
      processScannedCode(decodedText);
    }
  }

  // --- DATENVERARBEITUNG & BUCHUNG ---

  async function processScannedCode(code) {
    try {
      // Artikel anhand der ID (Code) in PouchDB suchen
      const item = await db.get(code);
      currentScannedItem = item;
      showBookingInterface(item);
    } catch (err) {
      if (err.status === 404) {
        document.getElementById("status").innerText = "Code nicht registriert!";
        alert("Der Code '" + code + "' wurde nicht in der Datenbank gefunden. Bitte legen Sie ihn im Adminbereich an.");
        zurueckZurHauptansicht();
      } else {
        console.error(err);
        document.getElementById("status").innerText = "Fehler beim Abrufen der Daten.";
      }
    }
  }

  function showBookingInterface(item) {
    document.getElementById("mainSection").classList.add("hidden");
    document.getElementById("adminSection").classList.add("hidden");
    document.getElementById("resultSection").classList.remove("hidden");

    document.getElementById("itemType").innerText = item.itemClass === 'verbrauch' ? 'Verbrauchsmaterial' : 'Werkzeug';
    document.getElementById("itemName").innerText = item.name;
    document.getElementById("itemId").innerText = item._id;

    // Foto verarbeiten
    const photoImg = document.getElementById("resultPhoto");
    if (item.photo) {
      photoImg.src = item.photo;
      photoImg.style.display = "block";
    } else {
      photoImg.style.display = "none";
      photoImg.src = "";
    }

    if (item.itemClass === 'verbrauch') {
      document.getElementById("itemStockRow").classList.remove("hidden");
      document.getElementById("itemStatusRow").classList.add("hidden");
      document.getElementById("itemStock").innerText = item.stock;

      document.getElementById("consumableBooking").classList.remove("hidden");
      document.getElementById("toolBooking").classList.add("hidden");
    } else {
      document.getElementById("itemStockRow").classList.add("hidden");
      document.getElementById("itemStatusRow").classList.remove("hidden");
      document.getElementById("itemStatus").innerText = item.status + (item.currentUser ? ` (${item.currentUser})` : '');

      document.getElementById("consumableBooking").classList.add("hidden");
      document.getElementById("toolBooking").classList.remove("hidden");
    }
  }

  async function saveBooking() {
    const techName = document.getElementById("technicianName").value.trim();
    const comment = document.getElementById("bookingComment").value.trim();

    if (!techName) {
      alert("Bitte geben Sie Ihren Namen ein.");
      return;
    }

    if (!currentScannedItem) return;

    try {
      // Aktuellen Stand neu laden, um Konflikte zu vermeiden
      let item = await db.get(currentScannedItem._id);
      
      let historyEntry = {
        timestamp: new Date().toISOString(),
        user: techName,
        comment: comment
      };

      if (!item.history) item.history = [];

      if (item.itemClass === 'verbrauch') {
        const qty = parseInt(document.getElementById("takeQuantity").value, 10);
        if (isNaN(qty) || qty <= 0) {
          alert("Ungültige Menge.");
          return;
        }
        if (item.stock < qty) {
          alert("Nicht genügend Bestand auf Lager! Aktuell: " + item.stock);
          return;
        }

        item.stock -= qty;
        historyEntry.action = `Entnahme: ${qty} Stk.`;
      } else {
        // Werkzeug Logik
        const action = document.getElementById("toolAction").value;
        historyEntry.action = action;

        if (action === "Ausleihen") {
          item.status = "Ausgeliehen";
          item.currentUser = techName;
        } else {
          item.status = "Verfügbar";
          item.currentUser = "";
        }
      }

      item.history.push(historyEntry);

      // Aktualisieren in PouchDB
      await db.put(item);

      alert("Buchung erfolgreich gespeichert!");
      zurueckZurHauptansicht();

    } catch (err) {
      console.error(err);
      alert("Fehler beim Speichern der Buchung: " + err.message);
    }
  }

  // --- ADMIN & ARTIKEL ANLEGEN ---

  function toggleAdmin() {
    const adminSec = document.getElementById("adminSection");
    const mainSec = document.getElementById("mainSection");
    
    if (adminSec.classList.contains("hidden")) {
      adminSec.classList.remove("hidden");
      mainSec.classList.add("hidden");
      loadInventoryTable();
    } else {
      adminSec.classList.add("hidden");
      mainSec.classList.remove("hidden");
    }
  }

  function toggleAdminFormFields() {
    const itemClass = document.getElementById("itemClass").value;
    const consumableFields = document.getElementById("adminConsumableFields");
    
    if (itemClass === 'verbrauch') {
      consumableFields.classList.remove("hidden");
    } else {
      consumableFields.classList.add("hidden");
    }
  }

  // Foto-Vorschau & Base64 Konvertierung
  function previewAdminPhoto(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        currentAdminPhotoBase64 = e.target.result;
        const preview = document.getElementById("adminPhotoPreview");
        preview.src = currentAdminPhotoBase64;
        preview.style.display = "block";
      };
      reader.readAsDataURL(file);
    }
  }

  async function saveItemToDb() {
    const code = document.getElementById("adminCode").value.trim();
    const name = document.getElementById("adminName").value.trim();
    const itemClass = document.getElementById("itemClass").value;

    if (!code || !name) {
      alert("Bitte Barcode/ID und Name ausfüllen.");
      return;
    }

    let doc = {
      _id: code,
      name: name,
      itemClass: itemClass,
      photo: currentAdminPhotoBase64,
      createdAt: new Date().toISOString()
    };

    if (itemClass === 'verbrauch') {
      doc.stock = parseInt(document.getElementById("adminStock").value, 10) || 0;
    } else {
      doc.status = "Verfügbar";
      doc.currentUser = "";
    }

    try {
      // Prüfen ob Dokument bereits existiert (Update-Fall)
      try {
        let existingDoc = await db.get(code);
        doc._rev = existingDoc._rev; // PouchDB Revisions-ID für Update setzen
      } catch (e) {
        // Neu anlegen
      }

      await db.put(doc);
      alert("Artikel erfolgreich gespeichert!");

      // Felder zurücksetzen
      document.getElementById("adminCode").value = "";
      document.getElementById("adminName").value = "";
      document.getElementById("adminPhotoInput").value = "";
      document.getElementById("adminPhotoPreview").style.display = "none";
      currentAdminPhotoBase64 = "";

      loadInventoryTable();

    } catch (err) {
      console.error(err);
      alert("Fehler beim Speichern des Artikels: " + err.message);
    }
  }

  async function loadInventoryTable() {
    const tbody = document.querySelector("#inventoryTable tbody");
    tbody.innerHTML = "";

    try {
      const result = await db.allDocs({ include_docs: true });
      
      result.rows.forEach(row => {
        const item = row.doc;
        const tr = document.createElement("tr");

        let infoText = "";
        if (item.itemClass === 'verbrauch') {
          infoText = `Bestand: ${item.stock}`;
        } else {
          infoText = `Status: ${item.status || 'Verfügbar'}`;
          if (item.currentUser) infoText += ` (${item.currentUser})`;
        }

        tr.innerHTML = `
          <td>${item.itemClass === 'verbrauch' ? 'Verbrauch' : 'Werkzeug'}</td>
          <td>${item.name}</td>
          <td><code>${item._id}</code></td>
          <td>${infoText}</td>
          <td><button class="btn btn-red" style="padding:4px 8px; font-size:12px;" onclick="deleteItem('${item._id}', '${item._rev}')">🗑️</button></td>
        `;
        tbody.appendChild(tr);
      });

    } catch (err) {
      console.error("Fehler beim Laden der Übersicht:", err);
    }
  }

  async function deleteItem(id, rev) {
    if (confirm(`Möchten Sie den Artikel "${id}" wirklich löschen?`)) {
      try {
        await db.remove(id, rev);
        loadInventoryTable();
      } catch (err) {
        alert("Löschen fehlgeschlagen: " + err.message);
      }
    }
  }

  // --- EXPORT / IMPORT LOGIK ---

  async function exportDataJSON() {
    try {
      const result = await db.allDocs({ include_docs: true });
      const docs = result.rows.map(row => row.doc);
      
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(docs, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `lager_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    } catch (err) {
      alert("Export fehlgeschlagen: " + err.message);
    }
  }

  function importDataJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const docs = JSON.parse(e.target.result);
        if (!Array.isArray(docs)) {
          alert("Ungültiges JSON-Format.");
          return;
        }

        // PouchDB Massenimport
        // Wir entfernen _rev, damit Dokumente ggf. neu angelegt werden können oder überschreiben vorhandene
        for (let doc of docs) {
          try {
            let existing = await db.get(doc._id);
            doc._rev = existing._rev; // Bestehende überschreiben
          } catch (err) {
            delete doc._rev; // Neu anlegen
          }
          await db.put(doc);
        }

        alert("Import erfolgreich abgeschlossen!");
        loadInventoryTable();

      } catch (err) {
        alert("Import-Fehler: " + err.message);
      }
    };
    reader.readAsText(file);
  }

  // --- NAVIGATION UTILS ---

  function zurueckZurHauptansicht() {
    document.getElementById("resultSection").classList.add("hidden");
    document.getElementById("adminSection").classList.add("hidden");
    document.getElementById("mainSection").classList.remove("hidden");
    document.getElementById("status").innerText = "Bereit";
    
    // Inputs zurücksetzen
    document.getElementById("technicianName").value = "";
    document.getElementById("bookingComment").value = "";
    document.getElementById("takeQuantity").value = "1";
    currentScannedItem = null;
  }
</script>

</body>
</html>
