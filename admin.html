<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lager Admin-Interface</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- OCR Bibliothek für Texterkennung eingebunden -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 15px; background: #eef2f5; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; text-align: center; }
    button { width: 100%; padding: 15px; font-size: 18px; border: none; border-radius: 8px; color: white; margin-top: 10px; cursor: pointer; font-weight: bold; }
    .btn-main { background: #007bff; }
    .btn-in { background: #28a745; }
    .btn-out { background: #dc3545; }
    .btn-scan { background: #17a2b8; padding: 10px; font-size: 14px; margin-top: 5px; margin-bottom: 10px; }
    .btn-edit { background: #ffc107; color: #212529; }
    input { width: 100%; padding: 12px; font-size: 18px; text-align: center; margin-top: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    
    #cameraModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #cameraContainer {
      width: 90%;
      max-width: 450px;
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }
    #reader { width: 100%; margin: 0 auto; }
    
    #status { padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; background: #e9ecef; }
    .search-item { background: #fff; border: 1px solid #ddd; padding: 12px; margin-top: 8px; border-radius: 6px; text-align: left; cursor: pointer; }
    .search-item:hover { background: #e9ecef; }
    .search-item div { font-size: 13px; color: #555; margin-top: 4px; }
    .input-group { margin-bottom: 10px; text-align: left; }
    .input-group label { font-size: 12px; font-weight: bold; color: #666; }
  </style>
</head>
<body>

<div id="app">
  <!-- LOGIN SECTION -->
  <div id="loginSection" class="card">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Admin-Passwort eingeben" onkeyup="if(event.key==='Enter') loginAdmin()">
    <button class="btn-main" onclick="loginAdmin()">Anmelden</button>
  </div>

  <!-- MAIN ADMIN SCREEN -->
  <div id="adminSection" class="card" style="display:none;">
    <h2>Lager Admin</h2>
    <p id="adminSessionInfo" style="color: #28a745; font-size: 13px; font-weight: bold;"></p>
    
    <button class="btn-main" onclick="startMainScanner()">📷 Regal / Artikel scannen</button>
    <button style="background: #17a2b8; margin-top:10px;" onclick="zeigNeuerArtikelMaske()">➕ Neuen Artikel anlegen</button>
    
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    
    <label for="searchInput" style="font-weight: bold;">Oder Artikel suchen:</label>
    <input type="text" id="searchInput" placeholder="...Artikelbezeichnung, ArtikelID oder Lagerplatz" onkeyup="if(event.key==='Enter') artikelSuchen()">
    <button class="btn-main" style="background:#6c757d;" onclick="artikelSuchen()">🔍 Suchen</button>

    <div id="searchResults"></div>
  </div>

  <!-- KAMERA OVERLAY MODAL -->
  <div id="cameraModal">
    <div id="cameraContainer">
      <div id="reader"></div>
      <!-- UNSICHTBARES INPUT FÜR SYSTEM-KAMERA OCR -->
      <input type="file" id="ocrFileInput" accept="image/*" capture="environment" style="display:none" onchange="processOCRImage(this)">
      <button class="btn-out" onclick="stopCamera()" style="margin-top: 10px; padding: 10px;">Scanner Schließen</button>
    </div>
  </div>

  <!-- NEUER ARTIKEL MASKE -->
  <div id="newArtikelSection" class="card" style="display:none;">
    <h3>Neuen Artikel anlegen</h3>
    
    <div class="input-group">
      <label>Artikelname *</label>
      <input type="text" id="newArtName" placeholder="Artikelbezeichnung">
      <button class="btn-scan" onclick="startCameraOCR('newArtName')">📷 Text von Foto/Kamera scannen</button>
    </div>

    <div class="input-group">
      <label>Barcode / QR-Code</label>
      <input type="text" id="newArtCode" placeholder="Code eingeben oder scannen">
      <button class="btn-scan" onclick="startFieldScanner('newArtCode')">📷 Barcode / QR scannen</button>
    </div>

    <div class="input-group">
      <label>Lagerplatz-ID *</label>
      <input type="text" id="newArtLager" placeholder="Lagerplatz eingeben oder scannen">
      <button class="btn-scan" onclick="startFieldScanner('newArtLager')">📷 Lagerplatz scannen</button>
    </div>

    <div class="input-group">
      <label>Startbestand</label>
      <input type="number" id="newArtBestand" placeholder="Startbestand eingeben" min="0">
    </div>
    
    <button class="btn-in" onclick="erstelleArtikel()">Speichern</button>
    <button style="background:#6c757d; margin-top:10px;" onclick="zurueckZurHauptansicht()">Abbrechen</button>
  </div>

  <!-- ARTIKEL BEARBEITEN MASKE -->
  <div id="editArtikelSection" class="card" style="display:none;">
    <h3>Artikel bearbeiten</h3>
    
    <div class="input-group">
      <label>Artikelname *</label>
      <input type="text" id="editArtName" placeholder="Artikelbezeichnung">
      <button class="btn-scan" onclick="startCameraOCR('editArtName')">📷 Text von Foto/Kamera scannen</button>
    </div>

    <div class="input-group">
      <label>Barcode / QR-Code</label>
      <input type="text" id="editArtCode" placeholder="Code eingeben oder scannen">
      <button class="btn-scan" onclick="startFieldScanner('editArtCode')">📷 Barcode / QR scannen</button>
    </div>

    <div class="input-group">
      <label>Lagerplatz-ID *</label>
      <input type="text" id="editArtLager" placeholder="Lagerplatz eingeben oder scannen">
      <button class="btn-scan" onclick="startFieldScanner('editArtLager')">📷 Lagerplatz scannen</button>
    </div>
    
    <button class="btn-in" onclick="speichereArtikelBearbeitung()">Änderungen Speichern</button>
    <button style="background:#6c757d; margin-top:10px;" onclick="zurueckZumArtikel()">Abbrechen</button>
  </div>

  <!-- ARTIKEL & BUCHUNG DISPLAY -->
  <div id="artikelSection" class="card" style="display:none;">
    <h3 id="artName">-</h3>
    <p>Lagerplatz: <strong id="artLager">-</strong></p>
    <p id="artLagerDesc" style="font-size: 14px; color: #666; margin-top: -10px;"></p>
    <p>Aktueller Bestand: <strong id="artBestand" style="font-size: 24px; color: #007bff;">-</strong></p>
    
    <label for="menge">Menge:</label>
    <input type="number" id="menge" placeholder="Menge eingeben" min="1" inputmode="numeric">

    <button class="btn-in" onclick="buchen('EINLAGERUNG')">▲ Einlagern</button>
    <button class="btn-out" onclick="buchen('ENTNAHME')">▼ Entnehmen</button>
    <button class="btn-edit" onclick="zeigArtikelBearbeitenMaske()">✏️ Artikel bearbeiten</button>
    <button style="background:#6c757d; margin-top:20px;" onclick="zurueckZurHauptansicht()">Abbrechen</button>
  </div>

  <div id="status">Bereit</div>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyx_-OuTgUy-ZvXdkd2rLwM-DlkKmF9NhIy_ns2o7TtiSq5AOI9OGMiM3mp8Wg2FTky/exec";

  let html5QrcodeScanner = null;
  let currentArtikel = null;
  let adminPassword = null;
  let isBookingActive = false;
  let scanTargetInputId = null;

  window.onload = checkAdminAuth;

  function checkAdminAuth() {
    const storedPw = localStorage.getItem("adminPassword");
    const loginTime = localStorage.getItem("adminLoginTime");
    const now = new Date().getTime();

    if (storedPw && loginTime && (now - loginTime < 36000000)) {
      verifyPassword(storedPw);
    } else {
      showLogin();
    }
  }

  function showLogin() {
    localStorage.removeItem("adminPassword");
    localStorage.removeItem("adminLoginTime");
    adminPassword = null;
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("adminSection").style.display = "none";
    document.getElementById("artikelSection").style.display = "none";
    document.getElementById("newArtikelSection").style.display = "none";
    document.getElementById("editArtikelSection").style.display = "none";
    document.getElementById("status").innerText = "Bitte anmelden";
  }

  function loginAdmin() {
    const pw = document.getElementById("adminPassword").value.trim();
    if (!pw) return;
    document.getElementById("status").innerText = "Prüfe Passwort...";
    verifyPassword(pw);
  }

  function verifyPassword(pw) {
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "checkAdmin", adminPw: pw })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success === true) {
        adminPassword = pw;
        localStorage.setItem("adminPassword", adminPassword);
        localStorage.setItem("adminLoginTime", new Date().getTime());

        document.getElementById("loginSection").style.display = "none";
        document.getElementById("adminSection").style.display = "block";
        document.getElementById("adminSessionInfo").innerText = "Admin-Sitzung aktiv";
        document.getElementById("status").innerText = "Bereit";
      } else {
        showLogin();
        document.getElementById("status").innerText = "Falsches Passwort.";
      }
    })
    .catch(err => {
      showLogin();
      document.getElementById("status").innerText = "Verbindungsfehler.";
    });
  }

  function artikelSuchen() {
    const query = document.getElementById("searchInput").value.trim();
    if (!query) return;

    document.getElementById("status").innerText = "Suche läuft...";
    document.getElementById("searchResults").innerHTML = "";

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ adminPw: adminPassword, action: "suche", query: query })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.treffer && data.treffer.length > 0) {
        document.getElementById("status").innerText = data.treffer.length + " Artikel gefunden.";
        let html = "";
        data.treffer.forEach(art => {
          const descText = art.lagerplatzBeschreibung ? ` (${art.lagerplatzBeschreibung})` : "";
          html += `
            <div class="search-item" onclick="waehleArtikel('${art.artikelId}')">
              <strong>${art.artikelname}</strong>
              <div>Lagerplatz: ${art.lagerplatzName}${descText} | Bestand: ${art.bestand}</div>
            </div>
          `;
        });
        document.getElementById("searchResults").innerHTML = html;
      } else {
        document.getElementById("status").innerText = data.error || ("Keine Artikel zu '" + query + "' gefunden.");
      }
    })
    .catch(err => {
      document.getElementById("status").innerText = "Fehler: " + err;
    });
  }

  function waehleArtikel(artikelId) {
    document.getElementById("status").innerText = "Lade Artikel...";
    
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ adminPw: adminPassword, action: "getArtikel", code: artikelId })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.artikel) {
        zeigArtikelMaske(data.artikel);
      } else {
        document.getElementById("status").innerText = data.error || "Fehler beim Laden.";
      }
    });
  }

  function startMainScanner() {
    scanTargetInputId = null;
    startCamera();
  }

  function startFieldScanner(inputId) {
    scanTargetInputId = inputId;
    startCamera();
  }

  // OCR TEXT SCANNER
  function startCameraOCR(inputId) {
    scanTargetInputId = inputId;
    document.getElementById("ocrFileInput").click();
  }

  function processOCRImage(input) {
    if (input.files && input.files[0]) {
      const file = input.files[0];
      document.getElementById("status").innerText = "Lese Text aus Bild... (Bitte warten)";
      
      Tesseract.recognize(
        file,
        'deu+eng',
        { logger: m => console.log(m) }
      ).then(({ data: { text } }) => {
        const cleanedText = text.trim().replace(/[\r\n]+/g, " ");
        if (cleanedText && scanTargetInputId) {
          document.getElementById(scanTargetInputId).value = cleanedText;
          document.getElementById("status").innerText = "Text erkannt und eingefügt!";
        } else {
          document.getElementById("status").innerText = "Kein Text erkannt.";
        }
        input.value = "";
      }).catch(err => {
        document.getElementById("status").innerText = "OCR Fehler: " + err;
        input.value = "";
      });
    }
  }

  async function startCamera() {
    document.getElementById("status").innerText = "Starte Kamera...";
    document.getElementById("cameraModal").style.display = "flex";

    if (!html5QrcodeScanner) {
      html5QrcodeScanner = new Html5Qrcode("reader");
    }

    try {
      await html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess
      );
      document.getElementById("status").innerText = "Scanner aktiv...";
    } catch (err) {
      stopCamera();
      document.getElementById("status").innerText = "Kamera-Fehler: " + err;
    }
  }

  async function stopCamera() {
    if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
      await html5QrcodeScanner.stop();
    }
    document.getElementById("cameraModal").style.display = "none";
    document.getElementById("status").innerText = "Bereit";
  }

  async function onScanSuccess(decodedText) {
    await stopCamera();

    if (scanTargetInputId) {
      document.getElementById(scanTargetInputId).value = decodedText;
      document.getElementById("status").innerText = "Code eingescannt!";
      scanTargetInputId = null;
      return;
    }

    document.getElementById("status").innerText = "Lade Daten...";

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ adminPw: adminPassword, action: "getArtikel", code: decodedText })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.isLagerplatz) {
          if (data.treffer && data.treffer.length > 0) {
            document.getElementById("status").innerText = data.treffer.length + " Artikel an Lagerplatz '" + data.lagerplatzName + "' gefunden.";
            let html = "";
            data.treffer.forEach(art => {
              const descText = art.lagerplatzBeschreibung ? ` (${art.lagerplatzBeschreibung})` : "";
              html += `
                <div class="search-item" onclick="waehleArtikel('${art.artikelId}')">
                  <strong>${art.artikelname}</strong>
                  <div>Lagerplatz: ${art.lagerplatzName}${descText} | Bestand: ${art.bestand}</div>
                </div>
              `;
            });
            document.getElementById("searchResults").innerHTML = html;
            document.getElementById("adminSection").style.display = "block";
          } else {
            document.getElementById("status").innerText = "Lagerplatz '" + data.lagerplatzName + "' ist leer.";
          }
        } else if (data.artikel) {
          zeigArtikelMaske(data.artikel);
        }
      } else {
        document.getElementById("status").innerText = data.error || ("Code '" + decodedText + "' nicht gefunden.");
      }
    })
    .catch(err => {
      document.getElementById("status").innerText = "Fehler: " + err;
    });
  }

  function zeigArtikelMaske(artikel) {
    currentArtikel = artikel;
    document.getElementById("artName").innerText = artikel.artikelname;
    document.getElementById("artLager").innerText = artikel.lagerplatzName || artikel.lagerplatzId;
    document.getElementById("artLagerDesc").innerText = artikel.lagerplatzBeschreibung || "";
    document.getElementById("artBestand").innerText = artikel.bestand;
    document.getElementById("menge").value = "";
    
    document.getElementById("adminSection").style.display = "none";
    document.getElementById("newArtikelSection").style.display = "none";
    document.getElementById("editArtikelSection").style.display = "none";
    document.getElementById("artikelSection").style.display = "block";
    document.getElementById("status").innerText = "Artikel geladen.";
  }

  function zeigNeuerArtikelMaske() {
    document.getElementById("newArtName").value = "";
    document.getElementById("newArtCode").value = "";
    document.getElementById("newArtLager").value = "";
    document.getElementById("newArtBestand").value = "";
    
    document.getElementById("adminSection").style.display = "none";
    document.getElementById("artikelSection").style.display = "none";
    document.getElementById("editArtikelSection").style.display = "none";
    document.getElementById("newArtikelSection").style.display = "block";
    document.getElementById("status").innerText = "Neuen Artikel eingeben";
  }

  function zeigArtikelBearbeitenMaske() {
    if (!currentArtikel) return;
    document.getElementById("editArtName").value = currentArtikel.artikelname || "";
    document.getElementById("editArtCode").value = currentArtikel.qrcode || currentArtikel.barcode || "";
    document.getElementById("editArtLager").value = currentArtikel.lagerplatzId || "";
    
    document.getElementById("artikelSection").style.display = "none";
    document.getElementById("editArtikelSection").style.display = "block";
    document.getElementById("status").innerText = "Artikel bearbeiten";
  }

  function zurueckZumArtikel() {
    document.getElementById("editArtikelSection").style.display = "none";
    document.getElementById("artikelSection").style.display = "block";
    document.getElementById("status").innerText = "Artikel geladen.";
  }

  function zurueckZurHauptansicht() {
    stopCamera();
    document.getElementById("artikelSection").style.display = "none";
    document.getElementById("newArtikelSection").style.display = "none";
    document.getElementById("editArtikelSection").style.display = "none";
    document.getElementById("adminSection").style.display = "block";
    document.getElementById("status").innerText = "Bereit";
  }

  function erstelleArtikel() {
    const name = document.getElementById("newArtName").value.trim();
    const code = document.getElementById("newArtCode").value.trim();
    const lager = document.getElementById("newArtLager").value.trim();
    const bestand = document.getElementById("newArtBestand").value || "0";

    if (!name || !lager) {
      document.getElementById("status").innerText = "Name und Lagerplatz sind Pflichtfelder.";
      return;
    }

    document.getElementById("status").innerText = "Erstelle Artikel...";

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        adminPw: adminPassword,
        action: "createArtikel",
        artikelname: name,
        code: code,
        lagerplatzId: lager,
        bestand: bestand
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        document.getElementById("status").innerText = "Artikel erfolgreich angelegt!";
        document.getElementById("newArtName").value = "";
        document.getElementById("newArtCode").value = "";
        document.getElementById("newArtLager").value = "";
        document.getElementById("newArtBestand").value = "";
        setTimeout(zurueckZurHauptansicht, 1500);
      } else {
        document.getElementById("status").innerText = "Fehler: " + data.error;
      }
    })
    .catch(err => {
      document.getElementById("status").innerText = "Fehler: " + err;
    });
  }

  function speichereArtikelBearbeitung() {
    const name = document.getElementById("editArtName").value.trim();
    const code = document.getElementById("editArtCode").value.trim();
    const lager = document.getElementById("editArtLager").value.trim();

    if (!name || !lager) {
      document.getElementById("status").innerText = "Name und Lagerplatz sind Pflichtfelder.";
      return;
    }

    document.getElementById("status").innerText = "Speichere Änderungen...";

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        adminPw: adminPassword,
        action: "updateArtikel",
        artikelId: currentArtikel.artikelId,
        artikelname: name,
        code: code,
        lagerplatzId: lager
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        document.getElementById("status").innerText = "Artikel erfolgreich aktualisiert!";
        if (data.artikel) {
          currentArtikel = data.artikel;
        } else {
          currentArtikel.artikelname = name;
          currentArtikel.code = code;
          currentArtikel.lagerplatzId = lager;
          currentArtikel.lagerplatzName = lager;
        }
        setTimeout(() => {
          zeigArtikelMaske(currentArtikel);
        }, 1500);
      } else {
        document.getElementById("status").innerText = "Fehler: " + data.error;
      }
    })
    .catch(err => {
      document.getElementById("status").innerText = "Fehler: " + err;
    });
  }

  function buchen(typ) {
    if (isBookingActive) return;

    const menge = document.getElementById("menge").value.trim();
    if (!menge || Number(menge) <= 0) {
      document.getElementById("status").innerText = "Bitte eine gültige Menge eingeben.";
      return;
    }

    isBookingActive = true;
    document.getElementById("status").innerText = "Speichere Buchung...";

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        adminPw: adminPassword,
        action: "buchen",
        typ: typ,
        artikelId: currentArtikel.artikelId,
        menge: menge
      })
    })
    .then(res => res.json())
    .then(data => {
      isBookingActive = false;
      if (data.success) {
        document.getElementById("status").innerText = "Gebucht! Neuer Bestand: " + data.result.bestand;
        document.getElementById("artBestand").innerText = data.result.bestand;
        document.getElementById("menge").value = "";
        setTimeout(zurueckZurHauptansicht, 1500);
      } else {
        document.getElementById("status").innerText = "Fehler: " + data.error;
      }
    })
    .catch(err => {
      isBookingActive = false;
      document.getElementById("status").innerText = "Fehler: " + err;
    });
  }
</script>

</body>
</html>
