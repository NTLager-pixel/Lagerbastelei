<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagerbuchung</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 15px; background: #f4f4f9; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; text-align: center; }
    button { width: 100%; padding: 15px; font-size: 18px; border: none; border-radius: 8px; color: white; margin-top: 10px; cursor: pointer; font-weight: bold; }
    .btn-main { background: #007bff; }
    .btn-sub { background: #dc3545; }
    .btn-add { background: #28a745; }
    input { width: 100%; padding: 12px; font-size: 22px; text-align: center; margin-top: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    #reader { width: 100%; max-width: 500px; margin: 0 auto 15px auto; display: none; }
    #status { padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; background: #e9ecef; }
  </style>
</head>
<body>

<div id="app">
  <!-- LOGIN SCREEN -->
  <div id="loginSection" class="card">
    <h2>Lager-Zugang</h2>
    <p>Bitte zuerst den QR-Code an der Tür scannen.</p>
    <button class="btn-main" onclick="startScanner('LOGIN')">📷 Tür-Code scannen</button>
  </div>

  <!-- MAIN SCANNER SCREEN -->
  <div id="scanSection" class="card" style="display:none;">
    <h2>Lagerbuchung</h2>
    <p id="sessionInfo" style="color: #28a745; font-size: 13px; font-weight: bold;"></p>
    <button class="btn-main" onclick="startScanner('ARTIKEL')">📷 Regal / Artikel scannen</button>
  </div>

  <!-- KAMERA DISPLAY -->
  <div id="reader"></div>

  <!-- ARTIKEL & BUCHUNG DISPLAY -->
  <div id="artikelSection" class="card" style="display:none;">
    <h3 id="artName">-</h3>
    <p>Aktueller Bestand: <strong id="artBestand" style="font-size: 24px; color: #007bff;">-</strong></p>
    
    <label for="menge">Menge:</label>
    <input type="number" id="menge" value="1" min="1" inputmode="numeric">

    <button class="btn-sub" onclick="buchen('ENTNAHME')">▼ Entnehmen</button>
    <button class="btn-add" onclick="buchen('EINLAGERUNG')">▲ Einlagern</button>
  </div>

  <div id="status">Bereit</div>
</div>

<script>
  // 1. Hier deine Web-App-URL aus Google Apps Script eintragen (endet auf /exec)
  const GOOGLE_SCRIPT_URL = "DEINE_APPS_SCRIPT_WEB_APP_URL_HIER_EINSETZEN";
  
  // 2. Den Text eintragen, der auf dem QR-Code an der Tür gedruckt ist
  const DOOR_SECRET_CODE = "TUER-LAGER-2026"; 

  let html5QrcodeScanner = null;
  let scanMode = null;
  let currentArtikel = null;

  window.onload = checkSession;

  function checkSession() {
    const authTime = sessionStorage.getItem("authTime");
    const now = new Date().getTime();

    // Session-Dauer: 30 Minuten (30 * 60 * 1000 ms)
    if (authTime && (now - authTime < 1800000)) {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("scanSection").style.display = "block";
      const remainingMin = Math.round((1800000 - (now - authTime)) / 60000);
      document.getElementById("sessionInfo").innerText = "Aktiv für " + remainingMin + " Min.";
    } else {
      sessionStorage.removeItem("authTime");
      document.getElementById("loginSection").style.display = "block";
      document.getElementById("scanSection").style.display = "none";
      document.getElementById("artikelSection").style.display = "none";
    }
  }

  async function startScanner(mode) {
    scanMode = mode;
    document.getElementById("status").innerText = "Starte Kamera...";
    document.getElementById("reader").style.display = "block";

    if (!html5QrcodeScanner) {
      html5QrcodeScanner = new Html5Qrcode("reader");
    }

    try {
      await html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess
      );
      document.getElementById("status").innerText = "Scanner aktiv...";
    } catch (err) {
      document.getElementById("status").innerText = "Kamera-Fehler: " + err;
    }
  }

  async function onScanSuccess(decodedText) {
    await html5QrcodeScanner.stop();
    document.getElementById("reader").style.display = "none";

    if (scanMode === 'LOGIN') {
      if (decodedText === DOOR_SECRET_CODE) {
        sessionStorage.setItem("authTime", new Date().getTime());
        document.getElementById("status").innerText = "Zugang gewährt!";
        checkSession();
      } else {
        document.getElementById("status").innerText = "Ungültiger Tür-Code!";
      }
      return;
    }

    if (scanMode === 'ARTIKEL') {
      document.getElementById("status").innerText = "Lade Artikel...";
      
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getArtikel", code: decodedText })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.artikel) {
          currentArtikel = data.artikel;
          document.getElementById("artName").innerText = currentArtikel.artikelname;
          document.getElementById("artBestand").innerText = currentArtikel.bestand;
          document.getElementById("artikelSection").style.display = "block";
          document.getElementById("status").innerText = "Artikel geladen.";
        } else {
          document.getElementById("status").innerText = "Code '" + decodedText + "' nicht gefunden.";
        }
      })
      .catch(err => {
        document.getElementById("status").innerText = "Fehler: " + err;
      });
    }
  }

  function buchen(typ) {
    checkSession();
    if (!sessionStorage.getItem("authTime")) return;

    const menge = document.getElementById("menge").value;
    document.getElementById("status").innerText = "Speichere Buchung...";

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "buchen",
        typ: typ,
        artikelId: currentArtikel.artikelId,
        menge: menge
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        document.getElementById("status").innerText = "Gebucht! Neuer Bestand: " + data.result.bestand;
        document.getElementById("artBestand").innerText = data.result.bestand;
        document.getElementById("artikelSection").style.display = "none";
      } else {
        document.getElementById("status").innerText = "Fehler: " + data.error;
      }
    });
  }
</script>

</body>
</html>
